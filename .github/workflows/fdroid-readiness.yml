name: F-Droid readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run lint && npm run check:fdroid
      - name: Validate F-Droid metadata
        run: |
          python3 -m venv work/fdroid-tools
          work/fdroid-tools/bin/pip install fdroidserver==2.4.5
          mkdir -p work/fdroid-check/metadata
          cp .fdroid.yml work/fdroid-check/metadata/com.remind.app.yml
          cd work/fdroid-check
          ../fdroid-tools/bin/fdroid lint com.remind.app
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm run android:unsigned
      - name: Confirm unsigned APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"; then
            echo "Unexpected signed APK"; exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remind-unsigned-review-only
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk

